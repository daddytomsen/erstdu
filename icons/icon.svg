<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- ErstDu: zwei Lichter, die sich berühren (Rasterfassung: tools/icon-erzeugen.py) -->
  <defs>
    <clipPath id="ecke"><rect width="512" height="512" rx="112"/></clipPath>
    <radialGradient id="glanz" cx="0.48" cy="0.46" r="0.42">
      <stop offset="0" stop-color="#f3dcae" stop-opacity=".85"/>
      <stop offset="1" stop-color="#f3dcae" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="apricot" cx="0.62" cy="0.60" r="0.75">
      <stop offset="0" stop-color="#ffe2a8"/>
      <stop offset=".45" stop-color="#e0884c"/>
      <stop offset="1" stop-color="#86391c"/>
    </radialGradient>
    <linearGradient id="salbei" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a9c9b5"/>
      <stop offset=".55" stop-color="#58756a"/>
      <stop offset="1" stop-color="#26392e"/>
    </linearGradient>
    <radialGradient id="funke" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9b8"/>
      <stop offset="1" stop-color="#ffe9b8" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="kreisA"><circle cx="205" cy="205" r="148"/></clipPath>
  </defs>
  <g clip-path="url(#ecke)">
    <rect width="512" height="512" fill="#9aab94"/>
    <rect width="512" height="512" fill="url(#glanz)"/>
    <circle cx="205" cy="205" r="148" fill="url(#apricot)"/>
    <circle cx="307" cy="307" r="148" fill="url(#salbei)"/>
    <circle cx="307" cy="307" r="148" fill="#4a2e1c" opacity=".85" clip-path="url(#kreisA)"/>
    <circle cx="256" cy="256" r="66" fill="url(#funke)"/>
  </g>
