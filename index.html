<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ErstDu</title>
<meta name="description" content="Ein Moment am Tag. Nur für euch zwei.">
<meta name="theme-color" content="#f6efe6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1916" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ErstDu">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
/* Farben nach der Midjourney-Vorlage: Creme, Salbeigrün, Apricot, warmes Licht */
:root {
  --grund: #f6efe6;
  --karte: #fffaf4;
  --text: #2a2620;
  --leise: #857a6c;
  --linie: #ebe0d1;
  --salbei: #8a9d7e;
  --salbei-tief: #5f7556;
  --salbei-hell: #e3eadd;
  --apricot: #e8a26a;
  --apricot-tief: #b4612b;
  --apricot-hell: #fbe7d6;
  --fehler: #b3261e;
  --glas: rgba(255, 250, 244, .72);
  --glas-rand: rgba(255, 255, 255, .65);
  --schatten: 0 1px 2px rgba(70, 50, 30, .05), 0 10px 30px rgba(70, 50, 30, .08);
  --schatten-tief: 0 20px 50px rgba(70, 50, 30, .16);
  --morgen: linear-gradient(170deg, #f9dcc0 0%, #f2b98d 42%, #d9967a 70%, #9fae92 100%);
  --serif: ui-serif, "New York", "Iowan Old Style", Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  --rund: 26px;
  --ring-leer: #e9dfd2;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --grund: #1b1916;
    --karte: #26221d;
    --text: #f2eade;
    --leise: #a99c8b;
    --linie: #383128;
    --salbei: #9fb393;
    --salbei-tief: #b7caa9;
    --salbei-hell: #263022;
    --apricot: #f0a872;
    --apricot-tief: #f6bb8f;
    --apricot-hell: #3a2a1d;
    --fehler: #f2b8b5;
    --glas: rgba(38, 34, 29, .72);
    --glas-rand: rgba(255, 255, 255, .08);
    --schatten: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px rgba(0, 0, 0, .25);
    --schatten-tief: 0 20px 50px rgba(0, 0, 0, .45);
    --morgen: linear-gradient(170deg, #4a3427 0%, #7a4a32 45%, #4b4434 75%, #2c3328 100%);
    --ring-leer: #3c352c;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--grund); color: var(--text); }
body {
  font: 17px/1.45 var(--sans);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  min-height: 100dvh;
  padding-bottom: calc(96px + env(safe-area-inset-bottom));
}
body.ohne-leiste { padding-bottom: env(safe-area-inset-bottom); }
main { max-width: 560px; margin: 0 auto; padding: calc(20px + env(safe-area-inset-top)) 16px 32px; }
h1, h2, .frage, .serif { font-family: var(--serif); font-weight: 600; letter-spacing: -.015em; }
h1 { font-size: 32px; line-height: 1.12; margin: 8px 0 8px; }
h2 { font-size: 21px; margin: 28px 0 10px; }
p { margin: 0 0 12px; }
.leise { color: var(--leise); }
.klein { font-size: 14px; }
.zentriert { text-align: center; }
.kopf { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

/* Held: großes Foto (zuletzt geteilt) oder Morgenlicht, randlos oben */
.held {
  position: relative; overflow: hidden;
  margin: calc(-20px - env(safe-area-inset-top)) -16px 0;
  padding: calc(28px + env(safe-area-inset-top)) 22px 72px;
  min-height: min(56vh, 460px);
  display: flex; flex-direction: column; justify-content: flex-end;
  border-radius: 0 0 36px 36px;
  background: var(--morgen); color: #fff;
}
.held .bild { position: absolute; inset: 0; background-size: cover; background-position: center; }
.held::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(0,0,0,.18) 0%, rgba(0,0,0,0) 30%, rgba(30,20,10,.55) 100%);
}
.held.ohne-foto::before {
  content: ''; position: absolute; width: 220px; height: 220px; border-radius: 50%;
  right: -40px; top: calc(40px + env(safe-area-inset-top));
  background: radial-gradient(circle, rgba(255,246,228,.95) 0%, rgba(255,226,190,.55) 45%, rgba(255,210,170,0) 70%);
}
.held > :not(.bild) { position: relative; z-index: 1; }
.held .datum {
  align-self: flex-start; font-size: 13px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase;
  padding: 7px 12px; border-radius: 999px; margin-bottom: 14px;
  background: rgba(255,255,255,.22); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  border: 1px solid rgba(255,255,255,.35);
}
.held .frage { font-size: 36px; line-height: 1.08; margin: 0; text-shadow: 0 2px 18px rgba(0,0,0,.25); }
.held .bildnachweis { font-size: 13px; opacity: .85; margin-top: 10px; }

/* Wochenstreifen: eine Glasleiste mit sieben Kreisen; Ring links = du, rechts = Partner */
.woche {
  position: relative; z-index: 2; margin: -46px 0 18px; padding: 12px 12px 10px;
  border-radius: 24px; background: var(--glas); border: 1px solid var(--glas-rand); box-shadow: var(--schatten);
  -webkit-backdrop-filter: blur(20px) saturate(1.3); backdrop-filter: blur(20px) saturate(1.3);
}
.woche .tage { display: flex; justify-content: space-between; }
.woche .t { display: flex; flex-direction: column; align-items: center; gap: 5px; min-width: 38px; }
.woche .t span { font-size: 11px; font-weight: 600; color: var(--leise); text-transform: uppercase; letter-spacing: .04em; }
.woche .t i {
  position: relative; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center;
  font: 600 15px/1 var(--serif); font-style: normal; color: var(--text);
  background: conic-gradient(from 180deg, var(--l) 0 180deg, var(--r) 180deg 360deg);
}
.woche .t i::before { content: ''; position: absolute; inset: 3px; border-radius: 50%; background: var(--karte); z-index: -1; }
.woche .t i { isolation: isolate; }
.woche .t.heute span { color: var(--apricot-tief); }
.woche .t.heute i { color: #fff; }
.woche .t.heute i::before { background: var(--apricot); }
.woche .legende { display: flex; justify-content: center; gap: 16px; margin-top: 8px; font-size: 12px; color: var(--leise); }
.woche .legende span { display: inline-flex; align-items: center; gap: 6px; }
.woche .legende span::before { content: ''; width: 8px; height: 8px; border-radius: 50%; }
.woche .legende .ich::before { background: var(--apricot); }
.woche .legende .du::before { background: var(--salbei); }

.karte {
  background: var(--karte); border: 1px solid var(--linie); border-radius: var(--rund);
  padding: 18px; box-shadow: var(--schatten); margin-bottom: 14px; overflow: hidden;
}
.wer { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; margin-bottom: 6px; }
.wer::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--leise); }
.ich .wer { color: var(--apricot-tief); } .ich .wer::before { background: var(--apricot); }
.partner .wer { color: var(--salbei-tief); } .partner .wer::before { background: var(--salbei); }
.eintragtext { font-family: var(--serif); font-size: 19px; line-height: 1.42; white-space: pre-wrap; overflow-wrap: anywhere; }
.kartenfoto { display: block; width: calc(100% + 36px); max-width: none; margin: -18px -18px 14px; aspect-ratio: 4 / 3; object-fit: cover; background: var(--salbei-hell); }

.verdeckt {
  display: flex; gap: 14px; align-items: center; color: #fff;
  border-radius: var(--rund); padding: 20px 18px; margin-bottom: 14px;
  background: linear-gradient(135deg, var(--salbei) 0%, var(--salbei-tief) 100%);
  box-shadow: var(--schatten);
}
@media (prefers-color-scheme: dark) { .verdeckt { background: linear-gradient(135deg, #4f6146 0%, #34412f 100%); } }
.verdeckt .symbol {
  flex: none; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center;
  background: rgba(255,255,255,.2); font-size: 20px;
}
.verdeckt b { font-family: var(--serif); font-size: 18px; display: block; margin-bottom: 2px; }
.verdeckt span { font-size: 15px; opacity: .95; }

textarea, input, select {
  width: 100%; font: inherit; color: var(--text); background: var(--karte);
  border: 1.5px solid var(--linie); border-radius: 18px; padding: 14px 16px;
  outline: none; transition: border-color .15s, box-shadow .15s;
}
textarea { font-family: var(--serif); font-size: 19px; min-height: 120px; resize: none; }
textarea:focus, input:focus { border-color: var(--apricot); box-shadow: 0 0 0 4px var(--apricot-hell); }
input.code { font: 600 28px/1 ui-monospace, "SF Mono", monospace; letter-spacing: .3em; text-align: center; text-transform: uppercase; }
.zaehler { font-size: 13px; }
.formfuss { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; gap: 12px; }

/* Schreibkarte: zwei nummerierte Schritte, dann ein großer Knopf */
.schreibkarte { position: relative; z-index: 2; padding: 20px 18px 16px; }
.schreibkopf { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 10px; }
.schreibkopf b { display: block; font-family: var(--serif); font-size: 19px; line-height: 1.25; }
.schreibkopf .klein { display: block; margin-top: 1px; }
.schritt {
  flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
  font-size: 13px; font-weight: 700; color: #fff; background: var(--apricot); margin-top: 1px;
}
.schreibkarte textarea {
  background: color-mix(in srgb, var(--apricot-hell) 45%, var(--karte)); border: 1.5px solid transparent;
  border-radius: 18px; padding: 14px 16px; min-height: 110px;
}
.schreibkarte textarea:focus { border-color: var(--apricot); box-shadow: 0 0 0 4px var(--apricot-hell); }
.schreibkarte .zaehler { text-align: right; margin: 4px 4px 16px; }
.fotofeld {
  display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer;
  min-height: 84px; border-radius: 18px; margin-bottom: 16px;
  border: 1.5px dashed color-mix(in srgb, var(--salbei) 70%, transparent);
  background: color-mix(in srgb, var(--salbei-hell) 60%, var(--karte)); color: var(--salbei-tief);
  font-weight: 600; font-size: 15px;
}
.fotofeld.klein { min-height: 0; padding: 10px; border-style: solid; }
.fotofeld svg { width: 24px; height: 24px; }
.fotofeld input { display: none; }
.schreibkarte .vorschau { margin: 0 0 10px; }
.schreibkarte .vorschau img { border-radius: 18px; }
.schreibkarte .abbrechen { display: block; margin: 8px auto 0; }

.fotoknopf {
  display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
  padding: 10px 14px; border-radius: 999px; font-size: 15px; font-weight: 600;
  background: var(--salbei-hell); color: var(--salbei-tief);
}
.fotoknopf svg { width: 20px; height: 20px; }
.fotoknopf input { display: none; }
.vorschau { position: relative; margin: -18px -18px 14px; }
.vorschau img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; }
.vorschau button {
  position: absolute; top: 12px; right: 12px; width: 36px; height: 36px; padding: 0; border-radius: 50%;
  background: rgba(20,15,10,.55); color: #fff; font-size: 20px; line-height: 36px;
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
}

button {
  font: inherit; font-weight: 600; border: 0; border-radius: 999px; padding: 14px 20px;
  cursor: pointer; transition: transform .08s, opacity .15s, background .15s;
}
button:active { transform: scale(.98); }
button:disabled { opacity: .45; }
.haupt { background: var(--salbei-tief); color: #fff; width: 100%; font-size: 17px; }
@media (prefers-color-scheme: dark) { .haupt { color: #1b1916; } }
.haupt.knapp { width: auto; padding: 11px 22px; font-size: 16px; }
.zweit { background: var(--apricot-hell); color: var(--apricot-tief); width: 100%; }
.zweit.knapp { width: auto; padding: 11px 18px; font-size: 15px; }
.link { background: none; color: var(--apricot-tief); padding: 8px 0; font-weight: 600; }
.gefahr { background: none; color: var(--fehler); padding: 10px 0; }
.knopfreihe { display: flex; gap: 10px; margin-top: 12px; }
.knopfreihe > * { flex: 1; }
.fehler { color: var(--fehler); font-size: 15px; margin-top: 8px; }
.fehler:empty { display: none; }

/* Schwebende Glas-Leiste */
.leiste {
  position: fixed; z-index: 10; left: 50%; transform: translateX(-50%);
  bottom: calc(14px + env(safe-area-inset-bottom)); width: min(420px, calc(100% - 32px));
  display: flex; gap: 4px; padding: 6px;
  background: var(--glas); -webkit-backdrop-filter: blur(22px) saturate(1.4); backdrop-filter: blur(22px) saturate(1.4);
  border: 1px solid var(--glas-rand); border-radius: 30px; box-shadow: var(--schatten-tief);
}
.leiste button {
  flex: 1; background: none; color: var(--leise); padding: 8px 4px; border-radius: 24px;
  display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px;
}
.leiste button svg { width: 24px; height: 24px; }
.leiste button[aria-current="page"] { color: var(--apricot-tief); background: var(--apricot-hell); }

.monat { font-family: var(--serif); font-size: 22px; font-weight: 600; margin: 28px 0 12px; }
.tag { margin-bottom: 18px; }
.tag .datumzeile { font-size: 13px; color: var(--leise); margin: 0 0 8px 4px; text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
.tag .karte { margin-bottom: 10px; }
.tag .eintragtext { font-size: 17px; }
.suche { margin-bottom: 4px; border-radius: 999px; padding-left: 20px; }
mark { background: var(--apricot-hell); color: inherit; border-radius: 3px; }

.zahlen { display: flex; gap: 10px; margin: 8px 0 16px; }
.zahl { flex: 1; background: var(--karte); border: 1px solid var(--linie); border-radius: 20px; padding: 12px 8px; text-align: center; box-shadow: var(--schatten); }
.zahl b { display: block; font-family: var(--serif); font-size: 28px; line-height: 1.1; }
.zahl span { font-size: 12px; color: var(--leise); }

.paarkarte {
  position: relative; overflow: hidden; border-radius: var(--rund); margin-bottom: 14px;
  padding: 26px 22px; color: #fff; min-height: 180px; display: flex; flex-direction: column; justify-content: flex-end;
  background: linear-gradient(135deg, var(--salbei) 0%, var(--salbei-tief) 100%); box-shadow: var(--schatten);
}
.paarkarte .bild { position: absolute; inset: 0; background-size: cover; background-position: center; }
.paarkarte::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 30%, rgba(20,25,15,.6) 100%); }
.paarkarte > :not(.bild) { position: relative; z-index: 1; }
.paarkarte .namen { font-family: var(--serif); font-size: 30px; font-weight: 600; line-height: 1.1; }
.paarkarte .seit { font-size: 14px; opacity: .9; margin-top: 4px; }

.zeile { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--linie); }
.zeile:last-of-type { border-bottom: 0; }
.codeanzeige { font: 700 32px/1 ui-monospace, "SF Mono", monospace; letter-spacing: .25em; text-align: center; padding: 18px 0 12px; color: var(--apricot-tief); }
.hinweis { background: var(--apricot-hell); border-radius: 20px; padding: 14px 16px; font-size: 15px; margin-bottom: 14px; }
.demo-band { background: var(--salbei-hell); color: var(--text); text-align: center; font-size: 13px; padding: 6px; padding-top: calc(6px + env(safe-area-inset-top)); }
.demo-band:not([hidden]) + main { padding-top: 20px; }
.demo-band:not([hidden]) + main .held,
.demo-band:not([hidden]) + main .start-held { margin-top: -20px; padding-top: 40px; }

/* Startseite */
.start-held {
  margin: calc(-20px - env(safe-area-inset-top)) -16px 22px;
  padding: calc(56px + env(safe-area-inset-top)) 24px 40px; border-radius: 0 0 36px 36px;
  background: var(--morgen); color: #fff; text-align: center; position: relative; overflow: hidden;
}
.start-held::before {
  content: ''; position: absolute; width: 260px; height: 260px; left: 50%; top: 10%; transform: translateX(-50%);
  border-radius: 50%; background: radial-gradient(circle, rgba(255,246,228,.9) 0%, rgba(255,226,190,.4) 45%, rgba(255,210,170,0) 70%);
}
.start-held > * { position: relative; }
.start-held h1 { font-size: 40px; margin: 14px 0 6px; text-shadow: 0 2px 16px rgba(0,0,0,.18); }
.start-held p { opacity: .92; margin: 0; }
.logo { width: 76px; height: 76px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,.18); }

.schalter {
  -webkit-appearance: none; appearance: none; flex: none; width: 51px; height: 31px; margin: 0; padding: 0;
  border: 0; border-radius: 16px; background: var(--linie); position: relative; cursor: pointer; transition: background .2s;
}
.schalter::after {
  content: ''; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%;
  background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .25); transition: transform .2s;
}
.schalter:checked { background: var(--salbei); }
.schalter:checked::after { transform: translateX(20px); }
select { width: auto; border-radius: 14px; padding: 8px 12px; }
select:disabled { opacity: .45; }

.toast {
  position: fixed; left: 50%; bottom: calc(104px + env(safe-area-inset-bottom)); transform: translateX(-50%);
  background: var(--text); color: var(--grund); padding: 10px 18px; border-radius: 999px;
  font-size: 15px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20;
}
.toast.sichtbar { opacity: 1; }
.einblenden { animation: ein .4s ease-out; }
/* Willkommen-Seiten */
body.gesperrt { overflow: hidden; }
.willkommen {
  position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column;
  background: linear-gradient(180deg, color-mix(in srgb, var(--apricot-hell) 70%, var(--grund)) 0%, var(--grund) 55%);
  padding: env(safe-area-inset-top) 0 calc(20px + env(safe-area-inset-bottom));
  animation: ein .4s ease-out; transition: opacity .3s;
}
.willkommen.weg { opacity: 0; }
.willkommen .seiten {
  flex: 1; display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none;
}
.willkommen .seiten::-webkit-scrollbar { display: none; }
.willkommen .seite {
  flex: 0 0 100%; scroll-snap-align: center; display: flex; flex-direction: column; justify-content: center;
  padding: 24px 32px; text-align: center; max-width: 560px; margin: 0 auto;
}
.willkommen h2 { font-size: 34px; line-height: 1.1; margin: 0 0 14px; }
.willkommen p { font-size: 18px; line-height: 1.5; color: var(--leise); margin: 0 auto; max-width: 30ch; }
.willkommen .unten { padding: 0 24px; max-width: 460px; width: 100%; margin: 0 auto; text-align: center; }
.willkommen .punkte { display: flex; gap: 8px; justify-content: center; margin-bottom: 20px; }
.willkommen .punkte i { width: 8px; height: 8px; border-radius: 4px; background: var(--linie); transition: width .2s, background .2s; }
.willkommen .punkte i.an { width: 24px; background: var(--apricot); }
.willkommen .unten .link { margin-top: 6px; }
.motiv { position: relative; width: 170px; height: 150px; margin: 0 auto 34px; }
.motiv::before, .motiv::after { content: ''; position: absolute; }
/* Liebe verbindet: zwei Lichter wie im App-Icon, die sich berühren (SVG in app.js) */
.motiv-lichter { height: 200px; margin-bottom: 30px; }
.motiv .lichter { position: absolute; left: 50%; top: 50%; width: 210px; height: 210px; margin: -105px 0 0 -105px; overflow: visible; }
.lichter .licht-a { animation: licht-a 1.6s cubic-bezier(.22,.8,.3,1) both; }
.lichter .licht-b { animation: licht-b 1.6s cubic-bezier(.22,.8,.3,1) both; }
.lichter .funke { transform-origin: 100px 100px; animation: funke 1.2s ease-out 1.1s both; }
@keyframes licht-a { from { transform: translate(-26px, -26px); opacity: 0; } 40% { opacity: 1; } to { transform: none; } }
@keyframes licht-b { from { transform: translate(26px, 26px); opacity: 0; } 40% { opacity: 1; } to { transform: none; } }
@keyframes funke { from { transform: scale(.2); opacity: 0; } 60% { opacity: 1; } to { transform: scale(1); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .lichter .licht-a, .lichter .licht-b, .lichter .funke { animation: none; } }
.willkommen button:focus { outline: none; }
.willkommen button:focus-visible { outline: 3px solid var(--apricot); outline-offset: 3px; }
/* Ein Moment am Tag: Sonne über dem Horizont */
.m1::before { width: 120px; height: 120px; border-radius: 50%; left: 25px; top: 10px;
  background: radial-gradient(circle at 50% 45%, #ffe9c9 0%, var(--apricot) 70%); box-shadow: 0 0 60px rgba(232,162,106,.55); }
.m1::after { left: 0; right: 0; bottom: 0; height: 52px; border-radius: 0 0 26px 26px; background: var(--salbei); }
/* Erst teilen, dann sehen: zwei Karten */
